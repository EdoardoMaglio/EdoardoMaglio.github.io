# Workflow ufficiale Astro → GitHub Pages (https://github.com/withastro/action)
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta; quello in corso non viene interrotto.
concurrency:
  group: pages
  cancel-in-progress: false

# Come funziona:
#   1. «Verifica e costruzione» lancia `npm run build`, cioè prima strumenti/verifica.mjs
#      (controlla contenuti/sito.yml) e solo se passa `astro build`.
#   2. «Pubblicazione» parte solo se il passo 1 è riuscito (needs: build).
# Se la verifica trova un errore, il passo 1 diventa rosso, la pubblicazione non parte
# e online resta la versione precedente. Il messaggio con il numero di riga è nella scheda
# Actions di GitHub → l'esecuzione rossa → «Verifica e costruzione».
jobs:
  build:
    name: Verifica e costruzione
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verifica di sito.yml, build e upload
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run build   # = verifica + astro build

  deploy:
    name: Pubblicazione
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
