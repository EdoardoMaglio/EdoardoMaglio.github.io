# yaml-language-server: $schema=./sito.schema.json
# =====================================================================
#  TUTTI I CONTENUTI DEL SITO
#  Cambi una riga qui, salvi, e il sito si aggiorna.
#
#  Tre regole:
#  1. Rientro di 2 spazi, mai il tasto Tab.
#  2. Un testo che contiene i due punti ( : ) o che comincia con un
#     simbolo va tra virgolette:  testo: "Tesi: The STdouble2 Box Model"
#  3. Un campo vuoto ( "" ) o cancellato non compare sul sito.
#
#  Date: sempre anno-mese, per esempio 2025-07 (il sito mostra «lug 2025»).
#  Le righe che cominciano con # sono note: il sito le ignora.
# =====================================================================


# ===== PROFILO =====
profilo:
  nome: Edoardo Maglio
  titolo: Creative Technologist & AI Video Specialist
  presentazione: "Lavoro dove si incontrano racconto, tecnologia e marketing: scrivo, dirigo e costruisco con l'AI flussi di produzione che portano un'idea fino a un contenuto che funziona."
  email: maglio.edoardo42@gmail.com
  cv_pdf: cv/edoardo-maglio-cv.pdf   # file in public/. Vuoto ("") = niente pulsante
  link:
    - { nome: LinkedIn, url: "https://www.linkedin.com/in/edoardo-maglio-b419621a4" }
    - { nome: IMDb, url: "https://www.imdb.com/name/nm12219557/" }
    - { nome: GitHub, url: "https://github.com/EdoardoMaglio" }
  scheda:                       # la piccola scheda tecnica in apertura
    - { etichetta: Oggi, valore: "RedMoringa, Torino", da: 2025-07 }
    - { etichetta: Base, valore: Torino · cresciuto in Val Chisone }
    - { etichetta: Formazione, valore: "Ingegneria del Cinema e dei Media, Politecnico di Torino" }
    - { etichetta: Lingue, valore: Italiano · English (B2) }
  chi_sono: "Ingegnere del cinema e dei media, oggi Digital Marketing & AI Video Specialist in un'azienda di integratori a Torino. Vengo dal set (aiuto regia, montaggio, VFX) e dalla scrittura (racconti e poesie premiati a livello nazionale). Progetto giochi da tavolo, di carte e videogiochi. Sono cresciuto in Val Chisone, e la cultura occitana e alpina torna spesso in quello che scrivo e progetto."


