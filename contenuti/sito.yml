  in_uso: { nome: In uso, vivo: true }
  concluso: { nome: Concluso }
  in_sviluppo: { nome: In sviluppo }
  in_testing: { nome: In testing }
  prototipo: { nome: Prototipo giocabile }
  concept: { nome: Concept }
  fermo: { nome: Fermo }


